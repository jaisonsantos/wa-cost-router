services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wa_cost_router
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/wa_cost_router
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-this-in-production
      APP_SECRET_KEY: please-change-me-in-production
      WA_VERIFY_TOKEN: my-verify-token
      SANDBOX_PROVIDERS: "true"
      SANDBOX_LATENCY_MS: "100"
      SANDBOX_FAILURE_RATE: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/wa_cost_router
      REDIS_URL: redis://redis:6379/0
      SANDBOX_PROVIDERS: "true"
      SANDBOX_LATENCY_MS: "100"
      SANDBOX_FAILURE_RATE: "0"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: python worker.py

  web:
    build: .
    ports:
      - "8080:80"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
