name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RATE_LIMIT_MESSAGES_PER_MIN: 120
  RATE_LIMIT_LOGIN_PER_MIN: 20
  SANDBOX_PROVIDERS: "true"
  SANDBOX_LATENCY_MS: 0
  SANDBOX_FAILURE_RATE: 0
  SENDGRID_API_KEY: sandbox-sendgrid-api-key
  SENDGRID_DEFAULT_SENDER_EMAIL: no-reply+sandbox@example.com
  SENDGRID_BASE_URL: https://api.sendgrid.com/v3
  TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
  TWILIO_AUTH_TOKEN: sandbox-twilio-auth-token
  TWILIO_FROM_NUMBER: +15558675309
  TWILIO_MESSAGING_SERVICE_SID: MG00000000000000000000000000000000

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if compgen -G 'backend/requirements*.txt' > /dev/null; then
            for requirement_file in backend/requirements*.txt; do
              pip install -r "$requirement_file"
            done
          fi

      - name: Lint backend
        run: make lint-backend

      - name: Test backend
        run: make test-backend

      - name: Multi-channel regression
        run: make test-backend-multichannel

      - name: Publish summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Backend";
            echo "";
            echo "- Status: ${JOB_STATUS}";
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: make test-frontend

      - name: Publish summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Frontend";
            echo "";
            echo "- Status: ${JOB_STATUS}";
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if compgen -G 'backend/requirements*.txt' > /dev/null; then
            for requirement_file in backend/requirements*.txt; do
              pip install -r "$requirement_file"
            done
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run end-to-end workflow
        shell: bash
        run: |
          set -euo pipefail
          if make -n ci >/dev/null 2>&1; then
            make ci
          else
            echo "make ci target not found; running docker compose build and up as fallback"
            docker compose build
            docker compose up --abort-on-container-exit
          fi

      - name: Collect logs
        if: ${{ always() }}
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/docker-compose.log || true

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: artifacts/
          if-no-files-found: warn

      - name: Cleanup
        if: ${{ always() }}
        run: docker compose down -v

      - name: Publish summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## End-to-end";
            echo "";
            echo "- Status: ${JOB_STATUS}";
          } >> "$GITHUB_STEP_SUMMARY"
